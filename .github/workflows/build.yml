name: Build Margin (Android + desktop)

# Run it from the Actions tab (Run workflow), or push a tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Convert icons to RGBA (Tauri requires it)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          import glob
          from PIL import Image
          for f in glob.glob("src-tauri/icons/*.png"):
              Image.open(f).convert("RGBA").save(f)
          PY

      - run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v7
        with:
          name: margin-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/dmg/*
            src-tauri/target/release/bundle/deb/*
            src-tauri/target/release/bundle/appimage/*

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm install

      - name: Create the Android project (first run only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Generate Android app icons
        continue-on-error: true
        run: npx @capacitor/assets generate --android

      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: margin-android-apk
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk