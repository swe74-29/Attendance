name: Release Windows app (auto-updating)

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "src-tauri/**"
      - "package.json"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Set the app version to 1.0.<run number>
        shell: bash
        env:
          RUN: ${{ github.run_number }}
        run: |
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version='1.0.'+process.env.RUN;fs.writeFileSync(f,JSON.stringify(j,null,2));"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Margin v__VERSION__"
          releaseBody: "Automatic build."
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
