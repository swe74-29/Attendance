name: Deploy Margin web app

# Runs by itself on every push to main that touches the app.
on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "app-icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Make the app icons
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image
          src = Image.open("app-icon.png").convert("RGBA")
          for n in (192, 512):
              src.resize((n, n), Image.LANCZOS).save(f"www/icon-{n}.png")
          PY

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: www

      - id: deployment
        uses: actions/deploy-pages@v5
        