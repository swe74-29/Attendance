name: Deploy Margin web app

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Make the app icons
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image
          src = Image.open("app-icon.png").convert("RGBA")
          for n in (192, 512):
              src.resize((n, n), Image.LANCZOS).save(f"public/icon-{n}.png")
          PY

      - run: npm install
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: www

      - id: deployment
        uses: actions/deploy-pages@v5
