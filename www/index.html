<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14203A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Margin: attendance tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F8FB; --surface:#FFFFFF; --ink:#14203A; --ink2:#55627A; --line:#D9E1EC; --rule:#E6ECF5;
  --margin:#F0A9B1; --tick:#D6455A; --accent:#1F3FBF; --accent-ink:#FFFFFF;
  --good:#146B45; --good-f:#2BA971; --good-bg:#DDF3E7;
  --edge:#7A4E00; --edge-f:#E3A62C; --edge-bg:#FFF0C7;
  --bad:#A61E30; --bad-f:#D8404F; --bad-bg:#FBE0E3;
  --hl:#FFE873; --hl-good:#B9EBCF; --hl-edge:#FFE28A; --hl-bad:#FFC9CF;
  --f-ui:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'Big Shoulders Display','Arial Narrow','Roboto Condensed',Impact,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1626; --surface:#161F33; --ink:#E7ECF6; --ink2:#9AA7BF; --line:#2A3650; --rule:#182238;
    --margin:#7A3844; --tick:#FF7A8C; --accent:#8FA8FF; --accent-ink:#0F1626;
    --good:#6FDCA6; --good-f:#3CCB8B; --good-bg:#12362A;
    --edge:#F2C260; --edge-f:#E9B54A; --edge-bg:#3A2F10;
    --bad:#FF8E9C; --bad-f:#F0687A; --bad-bg:#3E1A22;
    --hl:#6B5B00; --hl-good:#1C5B41; --hl-edge:#5A4713; --hl-bad:#6A2431;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1626; --surface:#161F33; --ink:#E7ECF6; --ink2:#9AA7BF; --line:#2A3650; --rule:#182238;
  --margin:#7A3844; --tick:#FF7A8C; --accent:#8FA8FF; --accent-ink:#0F1626;
  --good:#6FDCA6; --good-f:#3CCB8B; --good-bg:#12362A;
  --edge:#F2C260; --edge-f:#E9B54A; --edge-bg:#3A2F10;
  --bad:#FF8E9C; --bad-f:#F0687A; --bad-bg:#3E1A22;
  --hl:#6B5B00; --hl-good:#1C5B41; --hl-edge:#5A4713; --hl-bad:#6A2431;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--f-ui)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.brand{font:800 28px/1 var(--f-num);letter-spacing:.02em}
.brand::before{content:'';display:inline-block;width:3px;height:.85em;background:var(--tick);margin-right:9px;vertical-align:-.08em;border-radius:1px}

/* layout */
.app{min-height:100vh}
.side{display:none}
.snav{display:none}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--paper);border-bottom:1px solid var(--line)}
.top .semsel{max-width:58%}
.page{position:relative;padding:22px 16px 120px 38px;min-height:calc(100vh - 58px);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px)}
.page::before{content:'';position:absolute;left:24px;top:0;bottom:0;width:2px;background:var(--margin)}
.wrap{max-width:840px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav button,.snav button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.bnav button[aria-current=page],.snav button[aria-current=page]{color:var(--accent)}
.bnav svg,.snav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:250px 1fr}
  .top,.bnav{display:none}
  .side{display:flex;flex-direction:column;gap:22px;padding:26px 18px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--paper)}
  .snav{display:flex;flex-direction:column;gap:2px}
  .snav button{flex-direction:row;gap:12px;padding:10px 12px;font-size:15px;border-radius:9px;text-align:left}
  .snav button[aria-current=page]{background:var(--surface);box-shadow:inset 3px 0 0 var(--tick)}
  .page{padding:36px 56px 70px 72px;min-height:100vh}
  .page::before{left:50px}
  .tiny.push{margin-top:auto}
}

/* type */
h1.pt{font:800 clamp(38px,7vw,52px)/1 var(--f-num);margin-bottom:14px}
h2{font:800 30px/1 var(--f-num);margin:30px 0 12px;letter-spacing:.01em}
h3{font-size:16px;font-weight:700}
.hint{color:var(--ink2);font-size:14.5px;max-width:62ch}
.tiny{font-size:12.5px;color:var(--ink2)}
.num{font:800 50px/1 var(--f-num)}
.lnk{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0 0 0 8px;font-size:13.5px}

/* hero */
.hero{padding:2px 0 26px}
.hero .when{font-weight:600;color:var(--ink2);margin-bottom:6px}
.hero h1{font:800 clamp(44px,10vw,76px)/.98 var(--f-num);letter-spacing:.005em;margin-bottom:12px;max-width:14em}
.hero p{max-width:52ch;color:var(--ink2);margin-bottom:14px}
.hl{background:linear-gradient(to top,var(--hl) 0,var(--hl) 40%,transparent 40%);padding:0 .06em}
.hl.safe{background-image:linear-gradient(to top,var(--hl-good) 0,var(--hl-good) 45%,transparent 45%)}
.hl.partial{background-image:linear-gradient(to top,var(--hl-edge) 0,var(--hl-edge) 45%,transparent 45%)}
.hl.no{background-image:linear-gradient(to top,var(--hl-bad) 0,var(--hl-bad) 45%,transparent 45%)}

/* controls */
.btn{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
input,select,textarea{width:100%;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea{min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
label{display:block;font-size:13.5px;font-weight:600;color:var(--ink2)}
label input,label select{margin-top:4px;color:var(--ink);font-weight:400}
fieldset{border:0;padding:0;margin:16px 0 0}
legend{font-weight:700;padding:0;font-size:14.5px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;color:var(--ink);font-weight:400;cursor:pointer}
.opt input{width:auto;min-height:0;margin-top:5px}
.opt small{display:block;color:var(--ink2);font-size:13.5px}
.opt:has(input:checked){border-color:var(--accent);background:var(--rule)}
.semsel{font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:12px}
.form2{display:grid;gap:14px}
.addrow{display:flex;gap:8px;margin-bottom:12px}
.addrow .btn{white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tg{font-size:13px;color:var(--ink2);font-weight:600}
.pct{display:flex;align-items:baseline;gap:4px;margin-top:6px}
.pct .u{font:800 24px/1 var(--f-num)}
.pct .of{margin-left:8px;font-size:13.5px;color:var(--ink2)}
.bar{position:relative;height:10px;border-radius:6px;background:var(--rule);margin:12px 0 10px;--c:var(--accent)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--c)}
.bar b{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1px;background:var(--tick);border-radius:2px}
.st-ok .bar{--c:var(--good-f)} .st-edge .bar{--c:var(--edge-f)} .st-low .bar{--c:var(--bad-f)} .st-neu .bar,.st-na .bar{--c:var(--accent)}
.adv{font-weight:500}
.adv b{font-weight:800;font-size:1.1em}
.proj{color:var(--ink2);font-size:14px;margin-top:6px}
.ov{margin-bottom:8px}
.banner{border:1px dashed var(--ink2);border-radius:10px;padding:10px 12px;margin-bottom:18px;background:var(--surface);font-size:14.5px}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:22px;background:var(--surface);display:grid;gap:10px;justify-items:start}
.empty p{color:var(--ink2);max-width:52ch}
.nudge{margin-top:18px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.safe{background:var(--good-bg);color:var(--good)}
.pill.partial{background:var(--edge-bg);color:var(--edge)}
.pill.no{background:var(--bad-bg);color:var(--bad)}
.pill.none{background:var(--rule);color:var(--ink2)}
.chip{display:inline-block;font-size:13px;padding:2px 8px;border-radius:6px;background:var(--rule);margin:0 5px 5px 0}
.chip.x{background:transparent;border:1px dashed var(--ink2)}
.chip button{background:none;border:0;cursor:pointer;color:var(--ink2);padding:0 0 0 6px;font-weight:700}

/* attendance */
.datebar{display:flex;gap:8px;margin-bottom:8px}
.datebar input{flex:1;min-width:0}
.slotgroup{margin-top:12px}
.slot{padding:10px 0 4px}
.slot+.slot,.slotgroup h3+.slot{border-top:0}
.slot+.slot{border-top:1px solid var(--line);margin-top:6px}
.sl{font-size:13.5px;color:var(--ink2);margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true].P{background:var(--good-bg);border-color:var(--good-f);color:var(--good)}
.seg button[aria-pressed=true].A{background:var(--bad-bg);border-color:var(--bad-f);color:var(--bad)}
.seg button[aria-pressed=true].C{background:var(--rule);border-color:var(--ink2);color:var(--ink2)}
.form{display:grid;grid-template-columns:1fr 70px;gap:8px;margin-top:10px}
.form .btn{grid-column:1/-1}

/* planner */
.day{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px}
.day.safe{border-left-color:var(--good-f)} .day.partial{border-left-color:var(--edge-f)} .day.no{border-left-color:var(--bad-f)}
.day.none{background:transparent;border-style:dashed;padding:8px 14px}
.day.planned{box-shadow:0 0 0 2px var(--accent)}
.dw{font:800 28px/1 var(--f-num)}
.dd{font-size:12.5px;color:var(--ink2)}
.dtx{font-size:14px;color:var(--ink2);margin-top:2px}
.dtx.bad{color:var(--bad);font-weight:600}
.tog{min-height:40px;min-width:78px;border-radius:8px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;cursor:pointer}
.tog[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}

/* setup */
.sub{margin-bottom:10px}
.subhead{display:flex;gap:8px}
.subhead input{font-weight:700}
.ttwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tt{border-collapse:collapse;width:100%;min-width:540px}
.tt th,.tt td{padding:6px;text-align:center;border-bottom:1px solid var(--line);font-size:13.5px}
.tt tr:last-child td{border-bottom:0}
.tt th:first-child,.tt td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);min-width:120px;padding-left:12px}
.tt input{width:48px;text-align:center;padding:6px 2px;min-height:38px}
.semc{margin-bottom:12px}
.semc.viewing{border-color:var(--accent)}
.semc h3{font-size:18px}
.semc .hint{margin:4px 0 8px}

/* onboarding */
.onb{padding-top:14px}
.onb .brand{font-size:36px;margin-bottom:28px}
.onb .form2{margin:18px 0 12px}

#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:9px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (min-width:900px){#toast{bottom:28px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var KEY='margin.attendance.v1';
var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var WD=[1,2,3,4,5,6,0];
var $app=document.getElementById('app');
var pad=function(n){return String(n).padStart(2,'0');};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
var today=function(){return ymd(new Date());};
var addDays=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
var fmtDay=function(s){var d=parse(s);return DN[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()];};
var fmtShort=function(s){var d=parse(s);return d.getDate()+' '+MN[d.getMonth()];};
var dayLabel=function(s){var t=today();if(s===t)return 'Today, '+fmtDay(s);if(s===addDays(t,1))return 'Tomorrow, '+fmtDay(s);return fmtDay(s);};
var uid=function(){return Math.random().toString(36).slice(2,9);};
var sum=function(o){return Object.keys(o).reduce(function(a,k){return a+o[k];},0);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var classes=function(n){return n+' class'+(n===1?'':'es');};

/* ---------- state ---------- */
function blankSem(name,status){return {id:uid(),name:name,status:status||'upcoming',mode:'each',target:75,start:'',end:'',subjects:[],tt:{},extras:[],holidays:[],rec:{},baseDate:''};}
function counted(x,date){return !!(x&&x.baseDate)&&date<=x.baseDate;}
function stampBase(x){x.baseDate=((+x.baseA||0)||(+x.baseH||0))?(x.baseDate||today()):'';}
function fixSem(s){var b=blankSem(s.name||'Semester');for(var k in b){if(s[k]===undefined)s[k]=b[k];}s.subjects.forEach(function(x){if(x.baseDate===undefined)x.baseDate=((+x.baseA||0)||(+x.baseH||0))?(s.baseDate||''):'';});return s;}
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&Array.isArray(o.sems)){o.sems.forEach(fixSem);return o;}}}catch(e){}
  return {cur:null,sems:[]};
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var ui={tab:'overview',date:today(),armed:null,plan:{},backup:false};
var sem=function(){return S.sems.find(function(x){return x.id===S.cur;})||S.sems[0];};
var subOf=function(s,id){return s.subjects.find(function(x){return x.id===id;});};
var tOf=function(sub,s){var v=(s.mode==='each'&&sub&&sub.target!=null&&sub.target!=='')?+sub.target:s.target;return Math.min(1,Math.max(.01,v/100));};

/* ---------- attendance maths ---------- */
function semStats(s){
  var A={},H={};
  s.subjects.forEach(function(x){var h=+x.baseH||0;H[x.id]=h;A[x.id]=Math.min(+x.baseA||0,h);});
  for(var k in s.rec){
    var st=s.rec[k];if(st==='C')continue;
    var kp=k.split('|'),sub0=subOf(s,kp[1]);if(!sub0||counted(sub0,kp[0]))continue;var sid=kp[1];
    H[sid]++;if(st==='P')A[sid]++;
  }
  return {A:A,H:H};
}
function slotsOn(s,date){
  var out=[],wd=parse(date).getDay();
  if(s.holidays.indexOf(date)<0){
    var day=s.tt[wd]||{};
    s.subjects.forEach(function(x){var n=+day[x.id]||0;for(var i=0;i<n;i++)out.push({key:date+'|'+x.id+'|'+i,sub:x.id,extra:false});});
  }
  s.extras.forEach(function(e){if(e.date===date&&subOf(s,e.sub))out.push({key:date+'|'+e.sub+'|x'+e.id,sub:e.sub,extra:true,xid:e.id});});
  return out;
}
function remaining(s,from){
  if(!s.end)return null;
  var R={};s.subjects.forEach(function(x){R[x.id]=0;});
  var d=from,g=0;
  while(d<=s.end&&g++<800){slotsOn(s,d).forEach(function(sl){if(!(sl.key in s.rec)&&!counted(subOf(s,sl.sub),d))R[sl.sub]++;});d=addDays(d,1);}
  return R;
}
function calc(A,H,R,t){
  var pct=H>0?A/H*100:null;
  var skip=Math.max(0,Math.floor(A/t-H+1e-9));
  var need=0,cant=false;
  if(pct!=null&&A/H<t-1e-9){if(t>=1)cant=true;else need=Math.ceil((t*H-A)/(1-t)-1e-9);}
  var proj=null;
  if(R!=null){
    var fH=H+R,req=Math.max(0,Math.ceil(t*fH-1e-9)-A),feasible=req<=R;
    proj={R:R,req:req,feasible:feasible,bunk:feasible?R-req:0,best:fH>0?(A+R)/fH*100:null};
  }
  return {A:A,H:H,pct:pct,skip:skip,need:need,cant:cant,proj:proj};
}
function summary(s){
  var st=semStats(s),R=remaining(s,today());
  var subs=s.subjects.map(function(x){var t=tOf(x,s);return Object.assign({s:x,t:t},calc(st.A[x.id],st.H[x.id],R?R[x.id]:null,t));});
  var t=Math.min(1,Math.max(.01,s.target/100));
  var total=calc(sum(st.A),sum(st.H),R?sum(R):null,t);total.t=t;
  return {subs:subs,total:total};
}
/* Walk the next days. Assumes the student attends every class that is not planned as a bunk. */
function planDays(s,n,planned){
  var st=semStats(s),a=Object.assign({},st.A),h=Object.assign({},st.H),T=Math.min(1,Math.max(.01,s.target/100));
  var days=[],d=today();
  for(var i=0;i<n;i++,d=addDays(d,1)){
    if(s.end&&d>s.end)break;
    var slots=slotsOn(s,d).filter(function(sl){return !(sl.key in s.rec)&&!counted(subOf(s,sl.sub),d);});
    var cnt={},xc={};
    slots.forEach(function(sl){cnt[sl.sub]=(cnt[sl.sub]||0)+1;if(sl.extra)xc[sl.sub]=(xc[sl.sub]||0)+1;});
    var N=slots.length;
    var row={date:d,N:N,cnt:cnt,xc:xc,holiday:s.holidays.indexOf(d)>=0,planned:planned.has(d),had:slotsOn(s,d).length>0};
    if(N===0){row.status='none';days.push(row);continue;}
    if(s.mode==='total'){
      var tA=sum(a),tH=sum(h);
      var budget=Math.max(0,Math.floor(tA/T-tH+1e-9));
      row.budget=budget;row.status=budget>=N?'safe':(budget>0?'partial':'no');row.ok=budget>=N;
      row.after=(tH+N)>0?tA/(tH+N)*100:0;
      row.per=Object.keys(cnt).map(function(id){return {sub:subOf(s,id),n:cnt[id],pct:h[id]>0?a[id]/h[id]*100:0};}).sort(function(x,y){return y.pct-x.pct;});
    }else{
      var per=Object.keys(cnt).map(function(id){
        var sub=subOf(s,id),t=tOf(sub,s);
        var k=Math.max(0,Math.min(cnt[id],Math.floor(a[id]/t-h[id]+1e-9)));
        return {sub:sub,n:cnt[id],k:k,t:+(t*100).toFixed(1),after:(h[id]+cnt[id])>0?a[id]/(h[id]+cnt[id])*100:0};
      });
      row.per=per;
      var all=per.every(function(p){return p.k>=p.n;}),some=per.some(function(p){return p.k>0;});
      row.status=all?'safe':(some?'partial':'no');row.ok=all;
    }
    Object.keys(cnt).forEach(function(id){h[id]+=cnt[id];if(!row.planned)a[id]+=cnt[id];});
    days.push(row);
  }
  return days;
}

/* ---------- small view helpers ---------- */
var ic={
  overview:'<svg viewBox="0 0 24 24"><path d="M5 20v-6M12 20V6M19 20v-10"/></svg>',
  mark:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
  plan:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  setup:'<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',
  sems:'<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4z"/><path d="M5 17a3 3 0 013-3h11"/></svg>'
};
function empty(t,p,btn,act){return '<div class="empty"><h3>'+t+'</h3><p>'+p+'</p>'+(btn?'<button class="btn pri" data-act="'+act+'">'+btn+'</button>':'')+'</div>';}
function stCls(r,tp){if(r.pct==null)return 'st-na';if(r.pct>=tp-1e-9)return r.skip>0?'st-ok':'st-edge';return 'st-low';}
function bar(pct,tp){return '<div class="bar"><i style="width:'+Math.min(100,pct||0)+'%"></i>'+(tp!=null?'<b style="left:'+tp+'%" title="Minimum '+tp+'%"></b>':'')+'</div>';}
function pctBlock(r){return '<div class="pct"><span class="num">'+(r.pct==null?'–':r.pct.toFixed(1))+'</span><span class="u">'+(r.pct==null?'':'%')+'</span><span class="of">'+r.A+' of '+r.H+' classes attended</span></div>';}
function advice(r,tp){
  if(r.pct==null)return 'No classes marked yet.';
  if(r.pct>=tp-1e-9)return r.skip>0?'You can skip <b>'+r.skip+'</b> more '+(r.skip===1?'class':'classes')+' right now.':'Right at the limit. Attend the next class.';
  if(r.cant)return 'You can\'t get back to '+tp+'% any more.';
  return 'Attend the next <b>'+r.need+'</b> '+(r.need===1?'class':'classes')+' in a row to get back to '+tp+'%.';
}
function projLine(s,r){
  var p=r.proj;if(!p||r.pct==null&&p.R===0)return '';
  if(p.R===0)return '<p class="proj">No classes left before '+fmtShort(s.end)+'.</p>';
  if(p.feasible)return '<p class="proj">'+p.R+' classes left till '+fmtShort(s.end)+'. You can skip up to <b>'+p.bunk+'</b> of them and still finish above the minimum.</p>';
  return '<p class="proj">'+p.R+' classes left till '+fmtShort(s.end)+'. Even if you attend all of them you would finish at '+p.best.toFixed(1)+'%.</p>';
}
function planText(s,d){
  var tot=s.mode==='total';
  if(d.planned&&!d.ok){
    if(tot)return 'Skipping all would drop your overall attendance to '+d.after.toFixed(1)+'% (minimum '+s.target+'%).';
    return 'Skipping all would break the minimum: '+d.per.filter(function(p){return p.k<p.n;}).map(function(p){return esc(p.sub.name)+' would fall to '+p.after.toFixed(1)+'% (minimum '+p.t+'%)';}).join('; ')+'.';
  }
  if(d.status==='safe')return tot?'Overall stays above '+s.target+'% even if you skip everything.':'Every subject stays above its minimum, even if you skip everything.';
  if(d.status==='partial')return tot?'Room to skip '+d.budget+' of '+d.N+'. Skip from the subjects you are strongest in: '+d.per.map(function(p){return esc(p.sub.name);}).join(', ')+'.'
    :'Skip '+d.per.filter(function(p){return p.k>0;}).map(function(p){return esc(p.sub.name)+' ×'+p.k;}).join(', ')+'. Attend the rest.';
  return 'No room to skip. Attend everything.';
}
function banner(s){
  if(s.status!=='done')return '';
  var cur=S.sems.find(function(x){return x.status==='current';});
  return '<div class="banner">This semester is completed. Its attendance is saved here and you can still edit it.'+(cur?'<button class="lnk" data-act="openSem" data-id="'+cur.id+'">Go to '+esc(cur.name)+'</button>':'')+'</div>';
}

/* ---------- views ---------- */
function hero(s,sm){
  if(s.status==='done'){
    var p=sm.total.pct;
    return '<section class="hero"><div class="when">'+esc(s.name)+' is complete</div><h1>'+(p==null?'No attendance was recorded':'Finished at <span class="hl">'+p.toFixed(1)+'%</span>')+'</h1></section>';
  }
  var anyTT=s.extras.length||Object.keys(s.tt).some(function(w){return Object.keys(s.tt[w]).some(function(id){return s.tt[w][id]>0;});});
  if(!anyTT)return '<section class="hero"><h1>Add your <span class="hl">timetable</span> to see which days you can skip</h1><button class="btn pri" data-act="gosetup">Set timetable</button></section>';
  var d=planDays(s,14,new Set()).find(function(x){return x.status!=='none';});
  if(!d)return '<section class="hero"><h1>No classes coming up in the next two weeks</h1><p>Check the semester end date and your timetable in Setup.</p></section>';
  var big;
  if(d.status==='safe')big='You can skip <span class="hl safe">'+(d.N===1?'the one class':'all '+d.N+' classes')+'</span>';
  else if(d.status==='partial'){
    var K=s.mode==='total'?d.budget:d.per.reduce(function(a,p){return a+p.k;},0);
    big='You can skip <span class="hl partial">'+K+' of '+d.N+' classes</span>';
  }else big='<span class="hl no">Attend everything</span>';
  return '<section class="hero"><div class="when">'+dayLabel(d.date)+'</div><h1>'+big+'</h1><p>'+planText(s,d)+'</p><button class="btn" data-act="tab" data-tab="plan">Open the planner</button></section>';
}
function overall(s,sm){
  var t=sm.total,tot=s.mode==='total',tp=s.target;
  return '<section class="card ov '+(tot?stCls(t,tp):'st-neu')+'"><div class="row"><h3>Overall</h3>'+(tot?'<span class="tg">Minimum '+tp+'%</span>':'')+'</div>'+pctBlock(t)+bar(t.pct,tot?tp:null)+
    (tot?'<p class="adv">'+advice(t,tp)+'</p>'+projLine(s,t):'<p class="hint">All subjects together. Each subject is checked against its own minimum below.</p>')+'</section>';
}
function subjCard(s,r){
  var tot=s.mode==='total',tp=+(r.t*100).toFixed(1);
  return '<article class="card '+(tot?'st-neu':stCls(r,tp))+'"><div class="row"><h3>'+esc(r.s.name)+'</h3>'+(tot?'':'<span class="tg">Minimum '+tp+'%</span>')+'</div>'+pctBlock(r)+bar(r.pct,tot?s.target:tp)+

function vOverview(s){

/* ---------- shell + render ---------- */
function navHtml(cls){

function render(){
  var tt=document.querySelector('.ttwrap'),sx=tt?tt.scrollLeft:0;

  if(!S.sems.some(function(x){return x.id===S.cur;}))S.cur=S.sems[0].id;

/* ---------- actions ---------- */
var toastT;
function toast(m){
  var el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el);}
  el.textContent=m;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('on');},2600);
}
var armT;
function arm(key,fn){
  if(ui.armed===key){ui.armed=null;fn();return;}
  ui.armed=key;render();clearTimeout(armT);
  armT=setTimeout(function(){if(ui.armed===key){ui.armed=null;render();}},4000);
}
function goTop(){window.scrollTo(0,0);}

function act(a,d){
  var s=S.sems.length?sem():null;
  switch(a){
    case 'tab':ui.tab=d.tab;ui.armed=null;render();goTop();break;
    case 'gosetup':ui.tab='setup';render();goTop();break;
    case 'start':{
      var n=Math.max(1,Math.min(20,parseInt(document.getElementById('obN').value,10)||8));
      var c=Math.max(1,Math.min(n,parseInt(document.getElementById('obCur').value,10)||1));
      S.sems=[];
      for(var i=1;i<=n;i++)S.sems.push(blankSem('Semester '+i,i<c?'done':i===c?'current':'upcoming'));
      S.cur=S.sems[c-1].id;ui.tab='setup';render();goTop();
      toast('Semesters created. Add your subjects next.');break;
    }
    case 'dprev':ui.date=addDays(ui.date,-1);render();break;
    case 'dnext':ui.date=addDays(ui.date,1);render();break;
    case 'dtoday':ui.date=today();render();break;
    case 'mark':if(s.rec[d.key]===d.st)delete s.rec[d.key];else s.rec[d.key]=d.st;render();break;
    case 'allP':case 'allA':slotsOn(s,ui.date).forEach(function(sl){s.rec[sl.key]=a==='allP'?'P':'A';});render();break;
    case 'holiday':{
      var i2=s.holidays.indexOf(ui.date);
      if(i2>=0)s.holidays.splice(i2,1);
      else{s.holidays.push(ui.date);Object.keys(s.rec).forEach(function(k){var p=k.split('|');if(p[0]===ui.date&&p[2].charAt(0)!=='x')delete s.rec[k];});}
      render();break;
    }
    case 'addx':{
      var sub=document.getElementById('xsub').value;
      var cnt=Math.max(1,Math.min(6,parseInt(document.getElementById('xn').value,10)||1));
      if(!sub){toast('Add a subject first.');break;}
      for(var j=0;j<cnt;j++)s.extras.push({id:uid(),date:ui.date,sub:sub});
      render();toast(cnt===1?'Extra class added.':cnt+' extra classes added.');break;
    }
    case 'delx':{
      var ex=s.extras.find(function(e){return e.id===d.id;});
      if(ex){delete s.rec[ex.date+'|'+ex.sub+'|x'+ex.id];s.extras=s.extras.filter(function(e){return e.id!==d.id;});}
      render();break;
    }
    case 'plan':{
      var arr=(ui.plan[s.id]||[]).slice(),ix=arr.indexOf(d.date);
      if(ix>=0)arr.splice(ix,1);else arr.push(d.date);
      ui.plan[s.id]=arr;render();break;
    }
    case 'clearplan':ui.plan[s.id]=[];render();break;
    case 'addSub':{
      var inp=document.getElementById('newSub'),nm=inp.value.trim();
      if(!nm){toast('Type a subject name first.');break;}
      s.subjects.push({id:uid(),name:nm,target:null,baseA:0,baseH:0});
      render();var ni=document.getElementById('newSub');if(ni)ni.focus();break;
    }
    case 'delSub':arm('delSub'+d.id,function(){
      s.subjects=s.subjects.filter(function(x){return x.id!==d.id;});
      Object.keys(s.rec).forEach(function(k){if(k.split('|')[1]===d.id)delete s.rec[k];});
      s.extras=s.extras.filter(function(e){return e.sub!==d.id;});
      Object.keys(s.tt).forEach(function(w){delete s.tt[w][d.id];});
      render();toast('Subject deleted.');
    });break;
    case 'addHol':{
      var hv=document.getElementById('holDate').value;
      if(!hv){toast('Pick a date first.');break;}
      if(s.holidays.indexOf(hv)<0){
        s.holidays.push(hv);
        Object.keys(s.rec).forEach(function(k){var p=k.split('|');if(p[0]===hv&&p[2].charAt(0)!=='x')delete s.rec[k];});
      }
      render();break;
    }
    case 'delHol':s.holidays=s.holidays.filter(function(h){return h!==d.date;});render();break;
    case 'openSem':S.cur=d.id;ui.tab='overview';render();goTop();break;
    case 'curSem':
      S.sems.forEach(function(x){if(x.status==='current')x.status='upcoming';});
      S.sems.find(function(x){return x.id===d.id;}).status='current';
      S.cur=d.id;render();toast('Marked as your current semester.');break;
    case 'finishSem':{
      var idx=S.sems.findIndex(function(x){return x.id===d.id;});
      S.sems[idx].status='done';
      var nx=S.sems.slice(idx+1).find(function(x){return x.status==='upcoming';});
      if(nx){nx.status='current';S.cur=nx.id;toast(S.sems[idx].name+' saved as completed. '+nx.name+' is open.');ui.tab='setup';}
      else toast(S.sems[idx].name+' saved as completed.');
      render();goTop();break;
    }
    case 'delSem':arm('delSem'+d.id,function(){
      S.sems=S.sems.filter(function(x){return x.id!==d.id;});
      if(S.cur===d.id){var c2=S.sems.find(function(x){return x.status==='current';})||S.sems[0];S.cur=c2?c2.id:null;}
      render();toast('Semester deleted.');
    });break;
    case 'addSem':{
      var ns=blankSem('Semester '+(S.sems.length+1),'upcoming');S.sems.push(ns);render();toast(ns.name+' added.');break;
    }
    case 'showBackup':ui.backup=!ui.backup;render();break;
    case 'copyBackup':{
      var txt=JSON.stringify(S),ta=document.getElementById('bk');
      var done=function(ok){toast(ok?'Backup code copied.':'Select the text and copy it manually.');if(!ok&&ta){ta.focus();ta.select();}};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){done(true);},function(){var ok=false;try{ta.select();ok=document.execCommand('copy');}catch(e){}done(ok);});
      else{var ok2=false;try{ta.select();ok2=document.execCommand('copy');}catch(e){}done(ok2);}
      break;
    }
    case 'importBackup':{
      var ta2=document.getElementById('imp');if(ta2&&ta2.value.trim())ui.impText=ta2.value.trim();var raw=ui.impText||'';
      var o=null;try{o=JSON.parse(raw);}catch(e){}
      if(!o||!Array.isArray(o.sems)){toast('That does not look like a Margin backup code.');break;}
      arm('import',function(){
        o.sems.forEach(fixSem);S=o;if(!S.sems.some(function(x){return x.id===S.cur;}))S.cur=S.sems[0]?S.sems[0].id:null;
        ui.impText='';ui.tab='overview';render();toast('Backup restored.');
      });
      break;
    }
  }
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  act(b.dataset.act,b.dataset);
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var el=e.target.closest&&e.target.closest('[data-enter]');
  if(el){e.preventDefault();act(el.dataset.enter,{});}
});
document.addEventListener('change',function(e){
  var el=e.target,f=el.dataset&&el.dataset.f;if(!f)return;
  var s=S.sems.length?sem():null,id=el.dataset.id;
  var int=function(v,min,max){var n=parseInt(v,10);if(isNaN(n))n=min;return Math.max(min,Math.min(max,n));};
  switch(f){
    case 'switchSem':S.cur=el.value;render();return;
    case 'date':ui.date=el.value||today();render();return;
    case 'semName':if(el.value.trim())s.name=el.value.trim();else el.value=s.name;break;
    case 'semStart':s.start=el.value;break;
    case 'semEnd':s.end=el.value;break;
    case 'semMode':s.mode=el.value;render();return;
    case 'semTarget':{var v=parseInt(el.value,10);if(!isNaN(v))s.target=Math.max(1,Math.min(100,v));el.value=s.target;break;}
    case 'subName':{var x=subOf(s,id);if(x){if(el.value.trim())x.name=el.value.trim();else el.value=x.name;}break;}
    case 'subTarget':{var x2=subOf(s,id);if(x2)x2.target=el.value===''?null:int(el.value,1,100);break;}
    case 'subBaseA':{var x3=subOf(s,id);if(x3){x3.baseA=int(el.value,0,9999);stampBase(x3);}break;}
    case 'subBaseH':{var x4=subOf(s,id);if(x4){x4.baseH=int(el.value,0,9999);stampBase(x4);}break;}
    case 'tt':{var w=el.dataset.wd;s.tt[w]=s.tt[w]||{};s.tt[w][id]=int(el.value,0,9);el.value=s.tt[w][id];break;}
  }
  save();
});

render();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
